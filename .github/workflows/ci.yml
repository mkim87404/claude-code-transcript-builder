# Builds the solution in Release and runs the test suite on every push/PR to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: the workflow only checks out and builds, so it needs no write access or secrets.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes an in-flight run rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # WPF (net10.0-windows) only builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build TranscriptBuilder.slnx -c Release

      - name: Test
        run: dotnet test TranscriptBuilder.Tests -c Release --no-build
